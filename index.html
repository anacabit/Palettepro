<!DOCTYPE html>

<div class="selector">

<label>Color 6</label>

<input type="color" id="color6" value="#EF4444">

Generar 5 Paletas

</button>

<nav class="navbar">

<div class="marca">

LOGO

</div>

<ul>

<li>Inicio</li>

<li>Servicios</li>

<li>Productos</li>

<li>Contacto</li>

</ul>

</nav>

Diseña páginas increíbles

<h3>Tarjeta 2</h3>

<p>

Contenido de ejemplo.

</p>

</div>

<div class="card">

<p>

Contenido de ejemplo.

</p>
